<!doctype html>
<html><head><meta charset="utf-8"><title>HENRY HOUSE — SCHEMES</title>
<style>html,body{margin:0;background:#0e1114;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three/three.module.js",
  "three/addons/":"./vendor/three/addons/"
}}
</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { buildSchemeScene, schemeCamera, schemeViews } from '../tools/render/lib/scheme3d.mjs';
import { makeShiftCamera, Accumulator, sunDirection } from '../tools/render/lib/render.mjs';
import { SCHEMES } from '../model/schemes.mjs';

let renderer, state = null;
window.__loaded = false; window.__error = null;

window.setupScheme = function (id, w, h, viewId) {
  try {
    if (renderer) { renderer.dispose(); renderer.domElement.remove(); }
    const _views = schemeViews(id);
    const _V = _views.find(v => v.id === (viewId || 'compare')) || _views[0];
    const canvas = document.createElement('canvas');
    canvas.width = w || _V.w; canvas.height = h || _V.h;
    document.body.appendChild(canvas);
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(canvas.width, canvas.height, false);
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

    // Views are per scheme now and carry their own sun and exposure, at the
    // same standard as the main house. 'compare' stays one fixed camera for
    // every scheme so the A/B remains a comparison.
    const V = _V;
    // set AFTER the view is chosen — the first version assigned this next to
    // the other renderer settings, above the line that defines V, which throws
    renderer.toneMappingExposure = V.exposure ?? 1;
    const sun = sunDirection(V.sun || { dayOfYear: 288, hour: 14.2 });
    const built = buildSchemeScene(renderer, { schemeId: id, sun });
    const cam = makeShiftCamera({ focalMm: V.focal, aspect: canvas.width / canvas.height,
      position: new THREE.Vector3(...V.pos), target: new THREE.Vector3(...V.target), shift: V.shift });
    const accum = new Accumulator(renderer, canvas.width, canvas.height);
    accum.reset();
    state = { cam, accum, ...built };
    // exposed so tools/check/plan3d.mjs can walk the built graph and prove the
    // model contains the same fixtures, at the same coordinates, as the plan.
    // __building is the house without terrain or vegetation and __ground is
    // the finished grade under it, so tools/check/envelope.mjs can ask what a
    // mesh IS and how far it sits above the dirt instead of inferring both.
    window.__scene = built.scene;
    window.__building = built.building;
    window.__ground = built.heightAt;
    return { ok: true, name: built.scheme.name, metrics: built.metrics, view: V.id, w: V.w, h: V.h };
  } catch (e) { window.__error = e.message + '\n' + e.stack; return { ok: false, error: e.message }; }
};
window.renderPasses = function (n) {
  try {
    for (let i = 0; i < n; i++) state.accum.pass(state.scene, state.cam, state.rig);
    state.accum.present({ exposure: 1.0 });
    return { ok: true, samples: state.accum.samples };
  } catch (e) { window.__error = e.message + '\n' + e.stack; return { ok: false, error: e.message }; }
};
window.grab = function () { return renderer.domElement.toDataURL('image/png'); };
window.schemeViewIds = (id) => schemeViews(id).map(v => v.id);
window.__schemes = SCHEMES.map(s => s.id);
window.__loaded = true;
</script>
</body></html>
