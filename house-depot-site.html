<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HENRY HOUSE · Depot at the Site</title>
<style>
  :root{ --ink:#0c0e12; --line:#2a2f38; --chalk:#f3f4f6; --dim:#8b93a1; --amber:#e6b84d; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#dfe6ee;overflow:hidden;
    font-family:"DIN Alternate","Bahnschrift","Arial Narrow",system-ui,sans-serif;color:#1a2129}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;align-items:baseline;gap:12px;
    pointer-events:none;background:linear-gradient(180deg,rgba(20,26,34,.78),rgba(20,26,34,0));z-index:5;color:#f3f4f6}
  .hud h1{font-size:clamp(13px,1.8vw,19px);letter-spacing:.4em;font-weight:700;text-transform:uppercase}
  .hud .sub{font-size:10px;letter-spacing:.3em;color:#aeb6c2;text-transform:uppercase}
  .hud a{pointer-events:auto;color:var(--amber);font-size:10px;letter-spacing:.24em;text-decoration:none;text-transform:uppercase}
  .roster{position:fixed;left:14px;top:64px;z-index:5;border:1px solid var(--line);
    background:rgba(16,18,24,.88);backdrop-filter:blur(4px);padding:10px 12px;color:#e8edf2;max-width:210px}
  .roster .lab{font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-bottom:7px}
  .roster button{display:block;width:100%;text-align:left;background:none;border:0;color:#c3cad4;
    font:600 11.5px/1.9 inherit;letter-spacing:.05em;cursor:pointer;padding:1px 4px;border-radius:3px}
  .roster button:hover{color:#fff;background:rgba(255,255,255,.06)}
  .roster button.on{color:#10191b;background:var(--amber);font-weight:800}
  .hint{position:fixed;left:16px;bottom:14px;z-index:5;font-size:9.5px;letter-spacing:.24em;
    color:#5c6672;text-transform:uppercase;line-height:1.8}
  #status{position:fixed;right:16px;bottom:14px;z-index:5;font-size:10px;letter-spacing:.2em;
    color:#5c6672;text-transform:uppercase}
  /* on a phone the roster becomes a swipeable strip along the bottom */
  @media (pointer:coarse), (max-width:820px){
    .roster{left:0;right:0;top:auto;bottom:0;max-width:none;border:0;border-top:1px solid var(--line);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(12,16,22,.95)}
    .roster .lab{margin-bottom:6px}
    #list{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
    .roster button{flex:0 0 auto;width:auto;min-height:46px;padding:0 14px;border:1px solid var(--line);
      border-radius:9px;font-size:12px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
    .hint{display:none}
    #status{left:10px;right:10px;bottom:auto;top:44px;text-align:center;color:#cfd8e2}
    .hud{padding:10px 12px;flex-wrap:wrap;gap:8px}
    .hud .sub{width:100%;font-size:8.5px;letter-spacing:.18em}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <h1>Depot at the Site</h1>
  <span class="sub">TN-JOHNSON-100-064.03 · fetched elevation + imagery · ten houses</span>
  <a href="site.html">← the site fit</a>
  <a href="house-depot.html">the depot →</a>
</div>
<div class="roster"><div class="lab">Set on the land</div><div id="list"></div></div>
<div class="hint">drag orbit · wheel zoom</div>
<div id="status">loading the mountain…</div>

<script type="importmap">
{ "imports": {
  "three": "https://hartswf0.github.io/henry-house/web/vendor/three/three.module.js",
  "three/addons/": "https://hartswf0.github.io/henry-house/web/vendor/three/addons/"
}}
</script>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════════
   DEPOT AT THE SITE — every house, on the actual parcel.

   Nothing is copied here. The terrain, the Henry House and its materials are
   the repo's own scene.mjs, blob-imported with only its relative paths made
   absolute; the nine species are the depot page's own builders, cut between
   its KIT markers. Both worlds are written in FEET with the same axis
   convention, so a house from either source sits on siteZ() unchanged.
   ═══════════════════════════════════════════════════════════════════════════ */
import * as THREE from 'three';

const BASE = 'https://hartswf0.github.io/henry-house/';
const status = (t) => { document.getElementById('status').textContent = t; };

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7e0ea);
scene.fog = new THREE.Fog(0xd7e0ea, 700, 2400);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 6000);

scene.add(new THREE.HemisphereLight(0xdde7f2, 0x4a4438, 0.75));
const key = new THREE.DirectionalLight(0xfff2dd, 1.9);
key.position.set(320, 520, 260); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
{ const d = 320, c = key.shadow.camera; c.left = -d; c.right = d; c.top = d; c.bottom = -d; c.near = 10; c.far = 1600;
  key.shadow.bias = -0.0006; }
scene.add(key);

/* ── THE REAL LANDSCAPE ────────────────────────────────────────────────────
   Not a modelled hill: the actual ground. Terrarium elevation tiles (AWS
   open data) give the height, Esri World Imagery gives the surface, both
   pulled for a window centred on the parcel anchor and rebuilt in FEET so
   the houses — which are written in feet — sit on it without conversion.
   ────────────────────────────────────────────────────────────────────────── */
const ANCHOR = { lat: 36.28727777777778, lon: -81.92511111111111 };
const FT_PER_M = 3.280839895;
const t2 = {
  x: (lon, z) => (lon + 180) / 360 * Math.pow(2, z),
  y: (lat, z) => { const r = lat * Math.PI / 180;
    return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z); },
};
const img = (src) => new Promise((res, rej) => {
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => res(im); im.onerror = rej; im.src = src;
});
async function realGround(halfM) {
  const { lat, lon } = ANCHOR;
  const mLat = 111320, mLon = 111320 * Math.cos(lat * Math.PI / 180);
  const ez = 15;
  const ex0 = Math.floor(t2.x(lon - halfM / mLon, ez)), ex1 = Math.floor(t2.x(lon + halfM / mLon, ez));
  const ey0 = Math.floor(t2.y(lat + halfM / mLat, ez)), ey1 = Math.floor(t2.y(lat - halfM / mLat, ez));
  const ec = document.createElement('canvas');
  ec.width = (ex1 - ex0 + 1) * 256; ec.height = (ey1 - ey0 + 1) * 256;
  const eq = ec.getContext('2d', { willReadFrequently: true });
  const jobs = [];
  for (let j = ey0; j <= ey1; j++) for (let i = ex0; i <= ex1; i++) {
    jobs.push(img('https://s3.amazonaws.com/elevation-tiles-prod/terrarium/' + ez + '/' + i + '/' + j + '.png')
      .then(((ii, jj) => (im) => eq.drawImage(im, (ii - ex0) * 256, (jj - ey0) * 256))(i, j)).catch(() => {}));
  }
  await Promise.all(jobs);
  const ed = eq.getImageData(0, 0, ec.width, ec.height).data;
  const px = (a, b) => { const k = (Math.max(0, Math.min(ec.height - 1, b)) * ec.width
    + Math.max(0, Math.min(ec.width - 1, a))) * 4;
    return ed[k] * 256 + ed[k + 1] + ed[k + 2] / 256 - 32768; };
  const elevM = (la, lo) => {                       // bilinear — nearest gives terraces
    const fx = (t2.x(lo, ez) - ex0) * 256 - 0.5, fy = (t2.y(la, ez) - ey0) * 256 - 0.5;
    const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
    const a = px(ix, iy), b = px(ix + 1, iy), c = px(ix, iy + 1), d = px(ix + 1, iy + 1);
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  };
  // the grid, in FEET, x = east, y = north, centred on the anchor
  const N = 193, halfFt = halfM * FT_PER_M;
  const H = new Float32Array(N * N);
  const z0 = elevM(lat, lon) * FT_PER_M;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const eFt = -halfFt + 2 * halfFt * i / (N - 1), nFt = halfFt - 2 * halfFt * j / (N - 1);
    const la = lat + (nFt / FT_PER_M) / mLat, lo = lon + (eFt / FT_PER_M) / mLon;
    H[j * N + i] = elevM(la, lo) * FT_PER_M - z0;   // datum: the anchor is zero
  }
  const zAt = (xFt, yFt) => {                       // bilinear again, for seating houses
    const u = (xFt + halfFt) / (2 * halfFt) * (N - 1), v = (halfFt - yFt) / (2 * halfFt) * (N - 1);
    const i = Math.max(0, Math.min(N - 2, Math.floor(u))), j = Math.max(0, Math.min(N - 2, Math.floor(v)));
    const tu = Math.max(0, Math.min(1, u - i)), tv = Math.max(0, Math.min(1, v - j));
    const a = H[j * N + i], b = H[j * N + i + 1], c = H[(j + 1) * N + i], d = H[(j + 1) * N + i + 1];
    return (a * (1 - tu) + b * tu) * (1 - tv) + (c * (1 - tu) + d * tu) * tv;
  };
  // the surface: Esri World Imagery over the same window
  const iz = 17;
  const ix0 = Math.floor(t2.x(lon - halfM / mLon, iz)), ix1 = Math.floor(t2.x(lon + halfM / mLon, iz));
  const iy0 = Math.floor(t2.y(lat + halfM / mLat, iz)), iy1 = Math.floor(t2.y(lat - halfM / mLat, iz));
  const cc = document.createElement('canvas');
  cc.width = (ix1 - ix0 + 1) * 256; cc.height = (iy1 - iy0 + 1) * 256;
  const cq = cc.getContext('2d');
  const ij = [];
  for (let j = iy0; j <= iy1; j++) for (let i = ix0; i <= ix1; i++) {
    ij.push(img('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + iz + '/' + j + '/' + i)
      .then(((ii, jj) => (im) => cq.drawImage(im, (ii - ix0) * 256, (jj - iy0) * 256))(i, j)).catch(() => {}));
  }
  await Promise.all(ij);
  const sx0 = (t2.x(lon - halfM / mLon, iz) - ix0) * 256, sx1 = (t2.x(lon + halfM / mLon, iz) - ix0) * 256;
  const sy0 = (t2.y(lat + halfM / mLat, iz) - iy0) * 256, sy1 = (t2.y(lat - halfM / mLat, iz) - iy0) * 256;
  const oc = document.createElement('canvas'); oc.width = oc.height = 2048;
  oc.getContext('2d').drawImage(cc, sx0, sy0, sx1 - sx0, sy1 - sy0, 0, 0, 2048, 2048);
  const tex = new THREE.CanvasTexture(oc); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const geo = new THREE.PlaneGeometry(2 * halfFt, 2 * halfFt, N - 1, N - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let k = 0; k < pos.count; k++) pos.setY(k, zAt(pos.getX(k), -pos.getZ(k)));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.96 }));
  mesh.receiveShadow = true;
  return { mesh, zAt, reliefFt: Math.max(...H) - Math.min(...H) };
}

/* ── their scene module, with its privates exported ───────────────────────── */
async function siteModule() {
  const entry = BASE + 'tools/render/lib/scene.mjs';
  const r = await fetch(entry);
  if (!r.ok) throw new Error('scene.mjs http ' + r.status);
  let src = await r.text();
  src = src.replace(/(\bfrom\s*['"])(\.[^'"]*)(['"])/g, (m0, a, p, c) => a + new URL(p, entry).href + c);
  const mm = src.match(/\n  const M = \{[\s\S]*?\n  \};/);
  if (!mm) throw new Error('their material block moved');
  src += '\nexport function __site(){\n  const interior = false;\n' + mm[0]
    + '\n  try { _M = M; } catch(_){}\n'
    + '  return { terrain: buildTerrain(false), house: () => { const g = buildHouse(M); g.add(buildFrames(M)); return g; }, siteZ };\n}\n';
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  try { return (await import(url)).__site(); } finally { setTimeout(() => URL.revokeObjectURL(url), 30000); }
}
/* ── the depot kit, cut between its markers ───────────────────────────────── */
async function depotKit() {
  const r = await fetch(BASE + 'house-depot.html');
  if (!r.ok) throw new Error('depot http ' + r.status);
  const src = await r.text();
  const m0 = src.indexOf('KIT START'), m1 = src.indexOf('KIT END');
  if (m0 < 0 || m1 < 0) throw new Error('kit markers moved');
  let kit = src.slice(src.indexOf('*/', m0) + 2, src.lastIndexOf('/*', m1));
  kit = "import * as THREE from 'three';\nconst envMap = null;\nlet scene = null;\n" + kit
    + '\nexport const KIT = { roster, setCUR: (n) => { CUR = n; } };\n';
  const url = URL.createObjectURL(new Blob([kit], { type: 'text/javascript' }));
  try { return (await import(url)).KIT; } finally { setTimeout(() => URL.revokeObjectURL(url), 30000); }
}

/* ── THE BOUNDARY ──────────────────────────────────────────────────────────
   The parcel, the existing drive and the highway, read from the repo's own
   model/site-context.mjs (the same lon/lat the site fit uses) and laid on the
   fetched ground in feet. Without it the houses float in scenery; with it
   they stand on a property with a line around it. */
async function boundaries(zAt) {
  const m = await import(BASE + 'model/site-context.mjs');
  const { lat, lon } = ANCHOR;
  const mLat = 111320, mLon = 111320 * Math.cos(lat * Math.PI / 180);
  const toFt = ([lo, la]) => [((lo - lon) * mLon) * FT_PER_M, ((la - lat) * mLat) * FT_PER_M];
  const g = new THREE.Group();
  const line = (lls, colour, lift, close) => {
    const pts = lls.map(toFt);
    if (close) pts.push(pts[0]);
    const v = [];
    for (let i = 0; i + 1 < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const n = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / 12));
      for (let k = 0; k <= n; k++) {
        const t = k / n, x = ax + (bx - ax) * t, y = ay + (by - ay) * t;
        v.push(new THREE.Vector3(x, zAt(x, y) + lift, -y));
      }
    }
    const geo = new THREE.BufferGeometry().setFromPoints(v);
    g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: colour })));
    return pts;
  };
  const ring = line(m.PARCEL_LONLAT, 0xe6b84d, 3, true);      // the property line
  line(m.ROAD_LONLAT, 0xf0ede2, 2, false);                    // the existing drive
  if (m.HIGHWAY_LONLAT) line(m.HIGHWAY_LONLAT, 0x8d97a2, 2, false);
  ring.forEach(([x, y], i) => {                               // a post at every corner
    if (i % 2) return;
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 9, 6),
      new THREE.MeshStandardMaterial({ color: 0xe6b84d, roughness: 0.7 }));
    p.position.set(x, zAt(x, y) + 4.5, -y); p.castShadow = true; g.add(p);
  });
  return { group: g, acres: 29.34, corners: ring.length - 1 };
}

/* ── the yard ─────────────────────────────────────────────────────────────── */
const AZ = 70;                                  // the drawn siting azimuth
const houseRoot = new THREE.Group(); scene.add(houseRoot);
let siteZ = () => 0;
let henryBuild = null, roster = null;

function setHouse(i, btns) {
  houseRoot.clear();
  let inner, name;
  if (i === 0) {
    inner = henryBuild(); name = 'HENRY HOUSE';
    inner.position.set(-60, 0, 14.5);           // their pivot (60, 14.5) onto the anchor
  } else {
    const R = roster[i - 1]; name = R[1];
    inner = R[3]();
    const bb = new THREE.Box3().setFromObject(inner), c = bb.getCenter(new THREE.Vector3());
    inner.position.set(-c.x, -bb.min.y, -c.z);  // footprint centre on the anchor, base at 0
    const sprites = [];                          // never remove DURING traverse — it mutates the list under you
    inner.traverse((o) => { if (o.isSprite) sprites.push(o); });
    sprites.forEach((o) => o.parent && o.parent.remove(o));
  }
  const root = new THREE.Group();
  root.rotation.y = (90 - AZ) * Math.PI / 180;
  root.add(inner);
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(root);
  root.position.y = siteZ(0, 0) - (i === 0 ? bb.min.y - 1.5 : bb.min.y - 1.2);   // foundations bite the slope
  houseRoot.add(root);
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  btns.forEach((b, j) => b.classList.toggle('on', j === i));
  status(name + ' · az ' + AZ + '° · on the real ground');
}

(async () => {
  try {
    status('reading the mountain from the repo…');
    const site = await siteModule();
    henryBuild = site.house;
    status('fetching the real ground — elevation + imagery…');
    try {
      const G = await realGround(300);              // ±300 m ≈ ±985 ft of actual mountain
      siteZ = G.zAt;
      scene.add(G.mesh);
      status('real ground · ' + Math.round(G.reliefFt) + ' ft of relief across the window');
    } catch (e) {
      siteZ = site.siteZ; scene.add(site.terrain);  // the repo's modelled hill, if the tiles refuse
      status('tiles unavailable — modelled terrain (' + e.message.slice(0, 30) + ')');
    }
    status('reading the depot…');
    try {
      const B = await boundaries(siteZ);
      scene.add(B.group);
      status(document.getElementById('status').textContent + ' · parcel ' + B.corners + ' corners');
    } catch (e) { console.warn('[boundary]', e); }
    const kit = await depotKit();
    roster = kit.roster;
    const list = document.getElementById('list'), btns = [];
    ['Henry House', ...roster.map((r) => r[1])].forEach((nm, i) => {
      const b = document.createElement('button');
      b.textContent = (i === 0 ? '◆ ' : i + ' · ') + nm;
      b.addEventListener('click', () => setHouse(i, btns));
      list.appendChild(b); btns.push(b);
    });
    setHouse(0, btns);
  } catch (e) { status('failed: ' + e.message); console.error(e); }
})();

/* ── orbit ────────────────────────────────────────────────────────────────── */
const target = new THREE.Vector3(0, 24, 0);
let azim = 2.6, polar = 1.12, radius = 260, radiusGoal = 260, dragging = false, px = 0, py = 0;
function applyCam() {
  const sp = Math.sin(polar), cp = Math.cos(polar);
  camera.position.set(target.x + radius * sp * Math.sin(azim), target.y + radius * cp, target.z + radius * sp * Math.cos(azim));
  camera.lookAt(target);
}
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', () => { dragging = false; });
el.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  azim -= (e.clientX - px) * 0.005;
  polar = Math.min(1.5, Math.max(0.15, polar - (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY;
});
el.addEventListener('wheel', (e) => { e.preventDefault(); radiusGoal = Math.min(1400, Math.max(60, radiusGoal + e.deltaY * 0.5)); }, { passive: false });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() {
  requestAnimationFrame(loop);
  radius += (radiusGoal - radius) * 0.08;
  applyCam();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
