name: Build Henry House Reference Pack PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build-reference-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official reference assets
        shell: bash
        run: bash .github/scripts/reference-pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: henry-house-reference-assets
          path: reference-assets
          if-no-files-found: error
          compression-level: 6
